<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proedis UI</title>
    <script>
      /* The theme before the first paint, so a dark page never flashes white. The same key as src/docs/theme.ts */
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('ui-docs:theme'); } catch (e) {}
        var dark = stored === 'dark' || ((stored === null || stored === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
