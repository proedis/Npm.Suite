# Proedis Internal Platform: a single page application, internal by intent though public by address.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown;

  # Hashed by Vite: safe to keep for a year
  location /assets/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The documentation for language models (scripts/llms.mjs): text and Markdown, never the page
  location ~ ^/(llms\.txt|llms-full\.txt|llms/) {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    types {
      text/plain    txt;
      text/markdown md;
    }
    charset utf-8;
    charset_types text/plain text/markdown;
    try_files $uri =404;
  }

  # Every other address is a route of the application: the page, never cached, so a deploy is seen at once
  location / {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
